name: Rust qualification
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: telecodex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      text: ${{ steps.scope.outputs.text }}
      audio: ${{ steps.scope.outputs.audio }}
      activity: ${{ steps.scope.outputs.activity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess, re
          base = os.environ['BASE_SHA']
          if not base or set(base) == {'0'}:
              files = ['Cargo.toml']
          else:
              files = subprocess.check_output(['git','diff','--name-only',base,os.environ['HEAD_SHA']], text=True).splitlines()
          common = any(p in {'Cargo.toml','Cargo.lock','build.rs'} or not p.startswith(('src/','tests/','activity/','dashboard/','docs/','.github/')) and p not in {'README.md','LICENSE','.gitignore','config.example.toml'} for p in files)
          def workflow_job(source, name):
              marker = '  ' + name + ':\n'
              if marker not in source:
                  return None
              tail = source.split(marker, 1)[1]
              next_job = re.search(r'^  [a-zA-Z0-9_-]+:\n', tail, re.M)
              return (tail[:next_job.start()] if next_job else tail).rstrip()
          current = open('.github/workflows/ci.yml').read()
          previous = subprocess.check_output(['git','show',base+':.github/workflows/ci.yml'], text=True) if base and set(base) != {'0'} else ''
          header_changed = current.split('jobs:',1)[0] != previous.split('jobs:',1)[0]
          text_ci_changed = header_changed or workflow_job(current,'text') != workflow_job(previous,'text')
          text = common or text_ci_changed or any(p.startswith('src/') or p.startswith('tests/') and not p.startswith(('tests/activity','tests/dashboard')) for p in files)
          audio = common or header_changed or workflow_job(current,'audio') != workflow_job(previous,'audio') or any('audio' in p or 'transcrib' in p for p in files)
          activity = common or header_changed or workflow_job(current,'activity') != workflow_job(previous,'activity') or any(p.startswith(('activity/','tests/activity','scripts/activity_indicator.py')) for p in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in [('text',text),('audio',audio),('activity',activity)]:
                  out.write(f'{key}={str(value).lower()}\n')
          PY
  activity:
    needs: scope
    if: needs.scope.outputs.activity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -B tests/activity_io.py
  text:
    needs: scope
    if: needs.scope.outputs.text == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --release --no-default-features
      - run: python3 -B tests/ingress_io.py target/release/telecodex
      - run: python3 -B tests/artifacts_io.py target/release/telecodex
      - run: python3 -B tests/questions_io.py target/release/telecodex
      - run: python3 -B tests/pending_io.py target/release/telecodex
      - run: python3 -B tests/merge_io.py target/release/telecodex
      - run: python3 -B tests/stopping_io.py target/release/telecodex
      - run: python3 -B tests/goals_io.py target/release/telecodex
      - run: python3 -B tests/nexus_io.py target/release/telecodex
      - run: python3 -B tests/icons_io.py target/release/telecodex
      - run: python3 -B tests/stickers_io.py target/release/telecodex
      - run: python3 -B tests/fork_io.py target/release/telecodex
      - run: python3 -B tests/tribu_io.py target/release/telecodex
  audio:
    needs: scope
    if: needs.scope.outputs.audio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
          components: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r dashboard/requirements.lock
      - run: python -B tests/dashboard_io.py
      - run: node --check dashboard/web/app.js
