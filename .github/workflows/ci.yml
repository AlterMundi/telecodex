name: Rust qualification
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: telecodex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      text: ${{ steps.scope.outputs.text }}
      audio: ${{ steps.scope.outputs.audio }}
      activity: ${{ steps.scope.outputs.activity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ['BASE_SHA']
          if not base or set(base) == {'0'}:
              files = ['Cargo.toml']
          else:
              files = subprocess.check_output(['git','diff','--name-only',base,os.environ['HEAD_SHA']], text=True).splitlines()
          common = any(p in {'Cargo.toml','Cargo.lock','build.rs'} or not p.startswith(('src/','tests/','activity/','docs/','.github/')) and p not in {'README.md','LICENSE','.gitignore','config.example.toml'} for p in files)
          text = common or '.github/workflows/ci.yml' in files or any(p.startswith('src/') or p.startswith('tests/') and not p.startswith('tests/activity') for p in files)
          audio = common or any('audio' in p or 'transcrib' in p for p in files)
          activity = common or any(p.startswith(('activity/','tests/activity')) for p in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in [('text',text),('audio',audio),('activity',activity)]:
                  out.write(f'{key}={str(value).lower()}\n')
          PY
  activity:
    needs: scope
    if: needs.scope.outputs.activity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -B tests/activity_io.py
  text:
    needs: scope
    if: needs.scope.outputs.text == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --release --no-default-features
      - run: python3 -B tests/ingress_io.py target/release/telecodex
      - run: python3 -B tests/artifacts_io.py target/release/telecodex
      - run: python3 -B tests/questions_io.py target/release/telecodex
      - run: python3 -B tests/goals_io.py target/release/telecodex
      - run: python3 -B tests/icons_io.py target/release/telecodex
      - run: python3 -B tests/stickers_io.py target/release/telecodex
      - run: python3 -B tests/fork_io.py target/release/telecodex
      - run: python3 -B tests/tribu_io.py target/release/telecodex
  audio:
    needs: scope
    if: needs.scope.outputs.audio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
          components: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
