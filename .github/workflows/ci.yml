name: Rust qualification
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: telecodex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      text: ${{ steps.scope.outputs.text }}
      audio: ${{ steps.scope.outputs.audio }}
      activity: ${{ steps.scope.outputs.activity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess, re
          base = os.environ['BASE_SHA']
          if not base or set(base) == {'0'}:
              files = ['Cargo.toml']
          else:
              files = subprocess.check_output(['git','diff','--name-only',base,os.environ['HEAD_SHA']], text=True).splitlines()
          common = any(p in {'Cargo.toml','Cargo.lock','build.rs'} or not p.startswith(('src/','tests/','activity/','dashboard/','docs/','.github/')) and p not in {'README.md','AGENTS.md','LICENSE','.gitignore','config.example.toml','scripts/bot_traffic.py','scripts/routing_eval.py','scripts/speech_render.py','scripts/requirements-speech.lock','scripts/interaction_asr.py','scripts/turn_end.py','scripts/capture_turn.py','scripts/requirements-turn.lock','scripts/matrix_execution.py','scripts/activity_indicator.py'} for p in files)
          def workflow_job(source, name):
              marker = '  ' + name + ':\n'
              if marker not in source:
                  return None
              tail = source.split(marker, 1)[1]
              next_job = re.search(r'^  [a-zA-Z0-9_-]+:\n', tail, re.M)
              return (tail[:next_job.start()] if next_job else tail).rstrip()
          current = open('.github/workflows/ci.yml').read()
          previous = subprocess.check_output(['git','show',base+':.github/workflows/ci.yml'], text=True) if base and set(base) != {'0'} else ''
          header_changed = current.split('jobs:',1)[0] != previous.split('jobs:',1)[0]
          text_ci_changed = header_changed or workflow_job(current,'text') != workflow_job(previous,'text')
          text = common or text_ci_changed or any(p.startswith('src/') or p.startswith('tests/') and not p.startswith(('tests/activity','tests/dashboard','tests/conversation_ui.js','tests/live_speech_ui.js','tests/markdown_ui.js','tests/companion_ui.js','tests/conversation_requests_ui.js','tests/microphone_ui.js','tests/voice_stream_ui.js','tests/visual_ui.js','tests/routing_graph_ui.js','tests/bot_traffic_io.py','tests/routing_eval.py','tests/speech_render.py','tests/interaction_asr.py','tests/turn_end.py','tests/capture_turn.py','tests/voice_mode_ui.js','tests/presentation_io.py','tests/matrix_execution.py','tests/fixtures/routing-eval-')) for p in files)
          audio = common or header_changed or workflow_job(current,'audio') != workflow_job(previous,'audio') or any('audio' in p or 'transcrib' in p or 'voice' in p for p in files)
          activity = common or header_changed or workflow_job(current,'activity') != workflow_job(previous,'activity') or any(p.startswith(('activity/','tests/activity','scripts/activity_indicator.py')) for p in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in [('text',text),('audio',audio),('activity',activity)]:
                  out.write(f'{key}={str(value).lower()}\n')
          PY
  matrix-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AlterMundi/daimon-matrix
          ref: 9b2b8ec2c455d3bf316bc00dc9e1bac44e9d5094
          path: .matrix-sdk
      - run: python -m pip install cryptography==50.0.0 jsonschema==4.26.0 wasmtime==45.0.0 idna==3.20
      - run: python -B tests/matrix_execution.py -v
        env:
          PYTHONPATH: .matrix-sdk/src:.matrix-sdk
  routing-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -B tests/routing_eval.py
      - run: python3 -B scripts/routing_eval.py tests/fixtures/routing-eval-synthetic.json --baseline
  speech-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Ensure ASR preparation media tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Reuse the bounded native-journey prerequisite route. The Azure
            # mirror was still downloading libflite after15minutes in40415794052.
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors*.txt; do
              if [ -f "$source" ]; then
                sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
              fi
            done
            apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::http::Dl-Limit=0 -o Acquire::https::Dl-Limit=0)
            timeout 90s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg || {
              timeout 60s sudo apt-get "${apt_options[@]}" update
              timeout 90s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
            }
          fi
      - run: python3 -m pip install -r scripts/requirements-speech.lock
      - run: python3 -B tests/speech_render.py
      - run: python3 -B tests/interaction_asr.py
      - run: python3 -B tests/turn_end.py
      - run: python3 -B tests/capture_turn.py
  activity:
    needs: scope
    if: needs.scope.outputs.activity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -B tests/activity_io.py
  text:
    needs: scope
    if: needs.scope.outputs.text == 'true'
    runs-on: ubuntu-latest
    # The full native/HTTP suite exceeded 20 minutes after all completed gates passed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Restore text Rust build cache
        id: text-rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-text-rust195-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('src/**/*.rs', 'build.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-text-rust195-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --release --no-default-features
      # Build retention is separate from subsequent journey qualification.
      - name: Record built receiving executable
        run: |
          git rev-parse HEAD > target/release/telecodex-source.txt
          (cd target/release && sha256sum telecodex > telecodex.sha256)
      - name: Retain built receiving executable
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: telecodex-text-linux
          retention-days: 7
          if-no-files-found: error
          path: |
            target/release/telecodex
            target/release/telecodex-source.txt
            target/release/telecodex.sha256
      # Retain successful compilation even if a later process fixture fails.
      # Cached artifacts never skip fmt, clippy, Rust tests or the build command.
      - name: Save qualified text Rust build cache
        if: steps.text-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.text-rust-cache.outputs.cache-primary-key }}
      - name: Qualify internal workflow native returns
        run: python3 -B tests/workflow_native_returns_io.py target/release/telecodex
      - name: Qualify the optional shared integrating entry
        run: python3 -B tests/entry_projection_io.py target/release/telecodex
      # Exercise this new slice before the longer unchanged compatibility group.
      - name: Qualify live controller retirement and expression choices
        run: |
          python3 -B tests/goal_controls_io.py target/release/telecodex
          python3 -B tests/goal_activation_io.py target/release/telecodex
          python3 -B tests/goal_delegation_io.py target/release/telecodex
          python3 -B tests/goal_recovery_io.py target/release/telecodex
          python3 -B tests/goal_recovery_alerts.py
          python3 -B tests/goal_inspection_io.py target/release/telecodex
          python3 -B tests/live_tasks_io.py target/release/telecodex
          python3 -B tests/warm_controller_io.py target/release/telecodex
      # Native-question HTTP journeys also decode voice; provision after goals,
      # before the first voice-capable compatibility group.
      - name: Select voice dependency cache
        id: voice-image
        run: echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore voice dependency packages
        id: voice-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/telecodex-ffmpeg-apt
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.voice-image.outputs.image }}-ffmpeg-apt-v1
      - name: Ensure voice decoding prerequisite
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null; then
            # CI40379212762 spent 16m24s fetching 62.8MB from the Azure mirror,
            # exhausting the job before required native journeys could finish.
            # Keep Ubuntu signature verification and every qualification gate.
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors*.txt; do
              if [ -f "$source" ]; then
                sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
              fi
            done
            mkdir -p "$HOME/.cache/telecodex-ffmpeg-apt/partial"
            apt_options=(-o Dir::Cache::archives="$HOME/.cache/telecodex-ffmpeg-apt" -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::http::Dl-Limit=0 -o Acquire::https::Dl-Limit=0)
            timeout 90s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg || {
              timeout 60s sudo apt-get "${apt_options[@]}" update
              timeout 90s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
            }
          fi
      - name: Save voice dependency packages
        if: steps.voice-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/telecodex-ffmpeg-apt
          key: ${{ steps.voice-cache.outputs.cache-primary-key }}
      - name: Qualify independent foreground ingress and native-question journeys
        run: |
          python3 - <<'PYTHON'
          import concurrent.futures, subprocess, sys
          def qualify(suite):
              result = subprocess.run([sys.executable, '-B', 'tests/'+suite, 'target/release/telecodex'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              return suite, result
          failed = False
          # Both suites own isolated temporary SQLite/native/HTTP fixtures and
          # read the same immutable executable. Preserve every result and log.
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              jobs = [pool.submit(qualify, suite) for suite in ('ingress_io.py', 'questions_io.py')]
              for job in concurrent.futures.as_completed(jobs):
                  suite, result = job.result()
                  print(f'{suite}: exit {result.returncode}', flush=True)
                  print(result.stdout, end='', flush=True)
                  failed |= result.returncode != 0
          sys.exit(1 if failed else 0)
          PYTHON
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r dashboard/requirements.lock
      - run: python3 -B tests/conversation_http_io.py target/release/telecodex
      - run: python3 -B tests/conversation_requests_http_io.py target/release/telecodex
      - run: python3 -B tests/conversation_tasks_http_io.py target/release/telecodex
      - run: python3 -B tests/conversation_question_answer_http_io.py target/release/telecodex
      - run: python3 -B tests/conversation_context_http_io.py target/release/telecodex
      - run: python3 -B tests/conversation_live_response_http_io.py target/release/telecodex
      - run: python3 -B tests/conversation_files_media.py
      - run: python3 -B tests/conversation_files_http_io.py target/release/telecodex
      - run: python3 -B tests/conversation_visual_http_io.py target/release/telecodex
      - run: python3 -B tests/conversation_direct_routing_http_io.py target/release/telecodex
      - run: python3 -B tests/media_steer_io.py target/release/telecodex
      - run: python3 -B tests/conversation_cold_entry_http_io.py target/release/telecodex
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AlterMundi/daimon-matrix
          ref: 9b2b8ec2c455d3bf316bc00dc9e1bac44e9d5094
          path: .matrix-sdk
      - run: python3 -m pip install cryptography==50.0.0 jsonschema==4.26.0 wasmtime==45.0.0 idna==3.20
      - run: python3 -B tests/matrix_conversation_http_io.py target/release/telecodex
        env:
          PYTHONPATH: .matrix-sdk/src:.matrix-sdk
      - run: python3 -B tests/fixture_native_idle_io.py target/release/telecodex
      - run: python3 -B tests/request_turn_lifetime_io.py target/release/telecodex
      - run: python3 -B tests/conversation_voice_http_io.py target/release/telecodex
      - run: python3 -B tests/artifacts_io.py target/release/telecodex
      - run: python3 -B tests/artifact_access_http.py
      - run: python3 -B tests/artifact_return_io.py target/release/telecodex
      - run: python3 -B tests/artifact_projection_io.py target/release/telecodex
      - name: Qualify isolated interaction journeys
        run: |
          python3 - <<'PYTHON'
          import concurrent.futures, subprocess, sys
          def qualify(suite):
              result = subprocess.run([sys.executable, '-B', 'tests/'+suite, 'target/release/telecodex'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              return suite, result
          failed = False
          # Each suite owns its temporary database, native/HTTP peers and ports.
          # Bound the existing isolated fixture concurrency at four; retain every
          # case, log and nonzero exit result.
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              jobs = [pool.submit(qualify, suite) for suite in ('routing_io.py', 'observer_io.py', 'observer_tool_io.py', 'observer_interview_io.py', 'semantic_routing_io.py', 'creation_io.py', 'creation_recovery_io.py', 'attention_io.py', 'session_requests_io.py', 'workflow_io.py', 'presentation_control_io.py', 'conversation_input_control_io.py', 'conversation_routing_io.py', 'conversation_clarification_io.py')]
              for job in concurrent.futures.as_completed(jobs):
                  suite, result = job.result()
                  print(f'{suite}: exit {result.returncode}', flush=True)
                  print(result.stdout, end='', flush=True)
                  failed |= result.returncode != 0
          sys.exit(1 if failed else 0)
          PYTHON
      - name: Qualify independent lifecycle and presentation journeys
        run: |
          python3 - <<'PYTHON'
          import concurrent.futures, subprocess, sys
          def qualify(suite):
              result = subprocess.run([sys.executable, '-B', 'tests/'+suite, 'target/release/telecodex'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              return suite, result
          failed = False
          # Every suite owns its temporary native/HTTP peers, sockets and store.
          # Keep all existing gates and logs; at most four synthetic fixture processes.
          # Native/model work and physical devices are never shared by these suites.
          suites = ('pending_io.py', 'merge_io.py', 'stopping_io.py', 'attachment_io.py', 'voice_io.py', 'goals_io.py', 'nexus_io.py', 'nexus_context_io.py', 'icons_io.py', 'stickers_io.py', 'reactions_io.py', 'fork_io.py', 'tribu_io.py', 'topic_projection_io.py', 'native_delivery_recovery_io.py')
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              jobs = [pool.submit(qualify, suite) for suite in suites]
              for job in concurrent.futures.as_completed(jobs):
                  suite, result = job.result()
                  print(f'{suite}: exit {result.returncode}', flush=True)
                  print(result.stdout, end='', flush=True)
                  failed |= result.returncode != 0
          sys.exit(1 if failed else 0)
          PYTHON
  audio:
    needs: scope
    if: needs.scope.outputs.audio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
          components: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r dashboard/requirements.lock
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AlterMundi/daimon-alerts
          ref: 8a7d66977d2efdfc954f8a7fad2d499e01da6973
          path: .alerts-core
      - run: cargo build --locked --manifest-path .alerts-core/Cargo.toml
      - run: python -B tests/dashboard_alerts_io.py
        env:
          ALERTS_CORE_SOURCE: .alerts-core
      - run: python -B tests/dashboard_menu_io.py
      - run: python -B tests/bot_traffic_io.py
      - run: python -B tests/dashboard_traffic_io.py
        env:
          ALERTS_CORE_SOURCE: .alerts-core
      - run: python -B tests/dashboard_io.py
      - run: python -B tests/dashboard_companion_io.py
      - run: python -B tests/dashboard_live.py
      - run: python -B tests/dashboard_transcription.py
      - run: python -B tests/dashboard_live_transcription.py
      - run: node tests/dashboard_live_ui.js
      - run: python -B tests/dashboard_sonic.py
      - run: python -B tests/presentation_io.py
      - run: node --check dashboard/web/app.js
      - run: node --check dashboard/web/requests.js
      - run: node --check dashboard/web/microphone.js
      - run: node --check dashboard/web/routing_graph.js
      - run: node --check dashboard/web/companion.js
      - run: node --check dashboard/web/sonic.js
      - run: node --check dashboard/web/conversation.js
      - run: node tests/dashboard_ui.js
      - run: node tests/routing_graph_ui.js
      - run: node tests/companion_ui.js
      - run: node tests/dashboard_sonic_ui.js
      - run: node tests/dashboard_sonic_offline.mjs
      - run: node tests/markdown_ui.js
      - run: node tests/live_speech_ui.js
      - run: node tests/timing_ui.js
      - run: node tests/conversation_ui.js
      - run: node tests/conversation_requests_ui.js
      - run: node tests/microphone_ui.js
      - run: node tests/voice_stream_ui.js
      - run: node tests/voice_mode_ui.js
      - run: node tests/visual_ui.js
      - run: node tests/files_ui.js
