name: iOS native audio preparation
on:
  pull_request:
    paths: ['clients/ios/**', '!clients/ios/**/*.md', 'clients/android/app/src/main/assets/native-audio.js', '.github/workflows/ios-client.yml']
  push:
    branches: [master]
    paths: ['clients/ios/**', '!clients/ios/**/*.md', 'clients/android/app/src/main/assets/native-audio.js', '.github/workflows/ios-client.yml']
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-audio:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and test the bounded native audio core
        working-directory: clients/ios
        run: swift test --jobs 2 --scratch-path "$RUNNER_TEMP/daimon-ios-build"
      - name: Build the actual iOS Simulator app with the existing adapter
        run: |
          bash clients/ios/build-simulator.sh "$RUNNER_TEMP/daimon-ios-app" --qualification
      - name: Build the normal app without fixture trust code
        run: |
          bash clients/ios/build-simulator.sh "$RUNNER_TEMP/daimon-ios-pilot"
          nm -j "$RUNNER_TEMP/daimon-ios-pilot/Daimon.app/Daimon" | python3 -c 'import sys; assert "QualificationTLS" not in sys.stdin.read()'
      - name: Exercise the actual WebView and native PCM bridge without capture
        run: python3 clients/ios/test-simulator.py --app "$RUNNER_TEMP/daimon-ios-app/Daimon.app"
