# Optional shared launcher in this pair's bot menu; no named/Main registration needed.
# launcher_url = "https://your-pair.example.org/apps/"
# Optional exact own-home mounts; each route must preserve Origin and credentials.
# additional_origins = ["https://your-pair.example.org"]
# Owner-local configuration; never commit receiving values.
receiver_config = "/private/telecodex/config.toml"
native_home = "/private/native-codex"
state_dir = "/private/dashboard"
origin = "https://your-authorized-host"
prefix = "/sessions"
bot_id = 123456
bot_username = "YourBot"
label = "This receiving bot"
# Presentation only; native identity and permissions remain in their existing bindings.
daimon_name = "Your daimon"
# Optional public pair appearance from the existing shared Homemaker consumer.
# Resolves no viewer identity and grants no private preference/session access.
# appearance_origin = "https://your-receiving-home"
# Independent Interaction can select its authored design without changing Sessions.
# conversation_appearance = "authored" # default: "inherit"
# Optional: set only after BotFather confirms this named app on this same bot,
# pointing to the origin + prefix above. Menu then uses its half-height link.
# miniapp_short_name = "sessions"

[storage]
Host = "/"
Development = "/your-development-mount"

# Optional independent Daimon Alerts service; no activation by default.
# [alerts]
# enabled = true
# base_url = "http://127.0.0.1:8791"
# token_file = "/private/alerts/receiver-token"
# receiving_scope = "your-receiving-scope"
# adapter_id = "your-telegram-adapter"
# interval_seconds = 15
# launcher_origins = ["https://apps.example.org"] # Read-only signed-launch attention only.
# menu_attention = false # Opt-in colored emoji in this human's existing Apps menu label.
# deliver = false # Enable after qualifying this bot/destination and service grants.

# Optional private Bot API meter; no capture or observer activation by default.
# [traffic]
# enabled = true
# meter_config = "/private/receiving/meter.toml"
# interval_seconds = 10
# [traffic.alerts]
# enabled = true
# base_url = "http://127.0.0.1:8791"
# token_file = "/private/alerts/traffic-producer-token"
# producer_id = "your-bot-traffic"
# observer_id = "your-bot-traffic-observer"
# receiving_scope = "your-receiving-scope"

# Optional operator-enrolled interaction-only physical clients. No enrollment,
# recording or device activity is started by enabling the receiving route.
# [companion]
# enabled = true
# grants_dir = "/private/receiving/companion-grants"

# presentation_profile = "simple" # simple or explorer; appearance only, never permissions

# Optional trusted same-origin browser application using the existing shared auth.
# The home gateway must provide /access/identity and /access-client.js.
# Mount this sidecar at entry_path, preserving Host/cookies and setting
# X-Forwarded-Prefix to the entry path without its final slash.
# Add the exact home_origin to additional_origins above.
# [shared_auth]
# enabled = true
# home_origin = "https://your-registered-home"
# entry_path = "/interaction/"
# artifact_access = false

# Optional live input-transcription preparation; no conversational model change.
# Captions preserve the ordinary compressed original and final file-ASR provider.
# Prepared mode instead requires a matching interaction_asr.py streaming_cache_root.
# [streaming_transcription]
# enabled = true
# mode = "captions" # or "prepared" (legacy default)
# provider = "qwen" # or "gemini" for the dedicated Gemini transcription model
# endpoint = "wss://your-workspace.ap-southeast-1.maas.aliyuncs.com/api-ws/v1/realtime?model=qwen-audio-3.0-realtime-plus"
# Gemini endpoint (credential is sent privately in a header, never in this URL):
# endpoint = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent"
# credential_file = "/private/existing-provider-key"
# cache_root = "/private/receiving/streaming-transcripts"

# Optional shorter first spoken segment and one-ahead browser preparation.
# Requires the ordinary selected speech binding; default is false.
# [speech]
# binding = "/private/existing-speech-route.json"
# timeout_seconds = 60
# incremental_segments = false
# Optional Qwen SSE/MP3 output through the existing media element; default off.
# Unsupported MediaSource clients and native questions retain the WAV reader.
# streaming_output = false

# Optional Qwen word-end positions for exact plain-text projections; default off.
# Existing rendered or uncertain audio is reused/refused, never regenerated for timing.
# word_timestamps = false
