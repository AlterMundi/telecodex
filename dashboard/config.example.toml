# Owner-local configuration; never commit receiving values.
receiver_config = "/private/telecodex/config.toml"
native_home = "/private/native-codex"
state_dir = "/private/dashboard"
origin = "https://your-authorized-host"
prefix = "/sessions"
bot_id = 123456
bot_username = "YourBot"
label = "This receiving bot"
# Optional public pair appearance from the existing shared Homemaker consumer.
# Resolves no viewer identity and grants no private preference/session access.
# appearance_origin = "https://your-receiving-home"
# Optional: set only after BotFather confirms this named app on this same bot,
# pointing to the origin + prefix above. Menu then uses its half-height link.
# miniapp_short_name = "sessions"

[storage]
Host = "/"
Development = "/your-development-mount"

# Optional independent Daimon Alerts service; no activation by default.
# [alerts]
# enabled = true
# base_url = "http://127.0.0.1:8791"
# token_file = "/private/alerts/receiver-token"
# receiving_scope = "your-receiving-scope"
# adapter_id = "your-telegram-adapter"
# interval_seconds = 15
# deliver = false # Enable after qualifying this bot/destination and service grants.
